name: ledger
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the ledger from block 0"
        type: boolean
        default: false
concurrency:
  group: ledger
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ledger/run.mjs
        env:
          LEDGER_SHEET_ID: 1vDH6lXF_xegq8pWzGdDgHJPwnmpmoDXZoMaWj967UtM
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          REBUILD: ${{ inputs.rebuild || 'false' }}
